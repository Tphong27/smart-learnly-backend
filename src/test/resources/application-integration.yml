spring:
  datasource:
    url: jdbc:postgresql://${TESTCONTAINERS_HOST:localhost}:${TESTCONTAINERS_POSTGRES_PORT:5432}/${TESTCONTAINERS_POSTGRES_DB:smartlearnly_test}
    username: ${TESTCONTAINERS_POSTGRES_USERNAME:postgres}
    password: ${TESTCONTAINERS_POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  classroom:
    lifecycle:
      enabled: false
  security:
    authentication-mode: jwt
    jwt-secret: smart-learnly-integration-test-secret-key-at-least-32-characters-long
    jwt-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  hls:
    token-secret: smart-learnly-integration-test-hls-secret-at-least-32-characters
  seed:
    auth-users-enabled: false
  email:
    enabled: false
  rate-limit:
    auth:
      enabled: false

logging:
  level:
    com.smartlearnly.backend: DEBUG
    org.springframework.security: DEBUG
